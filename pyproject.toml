[project]
name = "submission-triage-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "langgraph>=0.2.0",
  "pydantic>=2.7.1",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "pyyaml>=6.0.1",
  "jinja2>=3.1.4",
]

[tool.setuptools.packages.find]
include = ["triage*"]
